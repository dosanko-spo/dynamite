<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'; media-src 'none'; font-src 'none'; worker-src 'none'; manifest-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f2ea">
<title>総当たり戦ボード</title>
<style>
:root{--bg:#f5f2ea;--card:#fffdf8;--ink:#1d2129;--muted:#5f6470;--line:#e4ddcf;--line2:#cfc6b4;--accent:#b83a24;--accent-soft:#f8e6e0;--ai:#244f78;--ai-soft:#e4edf6;--ok:#2d7445;--ok-soft:#e2f0e5;--warn:#8a5300;--warn-soft:#fcf0da;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","BIZ UDPGothic","Yu Gothic UI",Meiryo,system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
button,.pe,.nb,.chip,.tab,label.btn{-webkit-tap-highlight-color:transparent}
header.top{max-width:980px;margin:0 auto;padding:14px 16px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:19px;letter-spacing:.03em;line-height:1.3}
.brand small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);letter-spacing:0}
.lock{margin-left:auto;font-size:12px;color:var(--ai);background:var(--ai-soft);border-radius:999px;padding:4px 10px;white-space:nowrap}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .in{max-width:980px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:6px 10px;scrollbar-width:none}
nav.tabs .in::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 13px;border-radius:999px;font-size:15px;color:var(--muted);white-space:nowrap;cursor:pointer}
.tab[aria-selected=true]{background:var(--ink);color:#fff;font-weight:700}
.tab .ico,.tab .tsh{display:none}
.pno{display:inline-flex;align-items:center;justify-content:center;min-width:1.75em;height:1.45em;padding:0 .3em;margin-right:.35em;border-radius:6px;background:var(--ink);color:#fff;font-size:.72em;font-weight:800;line-height:1;flex:none}
.who{display:inline-flex;align-items:center;min-width:0}
.nb.win .pno{background:var(--accent)}
.nb.lose .pno{background:#b9bcc2}
.tieinfo{display:block;font-size:12px;color:var(--ai);margin-top:2px}
table.rk tr.tied td{background:#fbfaf6}
main{max-width:980px;margin:0 auto;padding:16px 16px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 8px}
label.f{display:block;margin:14px 0 5px;font-size:14px;font-weight:700}
.help{font-size:13px;color:var(--muted);margin:4px 0 0}
.help.c{text-align:center}
input[type=text],input[type=number],input[type=url],input[type=search],select,textarea{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:#fff;color:var(--ink)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.pe:focus-visible{outline:3px solid #7aa6d6;outline-offset:2px}
textarea{min-height:210px;line-height:1.75;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset.radios{border:0;padding:0;margin:14px 0 0}
fieldset.radios legend{font-size:14px;font-weight:700;padding:0;margin-bottom:4px}
fieldset.radios label{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:15px}
fieldset.radios input{width:20px;height:20px;accent-color:var(--accent)}
.btn{border:1px solid var(--line2);background:#fff;padding:10px 16px;border-radius:10px;cursor:pointer;font-size:15px;min-height:44px;line-height:1.3;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.small{min-height:38px;padding:6px 12px;font-size:14px}
.btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.hot{border-color:var(--accent);color:var(--accent);font-weight:700}
.btn.danger{border-color:var(--accent);color:var(--accent)}
.btn.wide{width:100%;font-size:17px;min-height:52px}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btns.tight{margin-top:0}
.filebtn input{display:none}
.info p{margin:10px 0 0}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0 0}
.ok{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0 0}
.warnbox{border-color:#e9c98f;background:var(--warn-soft)}
.warnbox h2{color:var(--warn)}
details{margin-top:12px}
summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--ai);padding:6px 0}
ul.ov{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
ul.ov li{display:flex;align-items:center;gap:8px}
ul.ov li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.ov select{width:auto;padding:6px 8px;font-size:15px}
.prog{height:6px;background:var(--line);border-radius:6px;margin-top:14px;overflow:hidden}
.prog .bar{height:100%;background:var(--accent);transition:width .15s}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 4px}
.sum div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
.sum b{display:block;font-size:20px;line-height:1.2}
.sum span{font-size:12px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.progline{display:flex;align-items:center;gap:10px;font-size:14px;flex:1;min-width:200px}
.pbar{flex:1;height:8px;background:var(--line);border-radius:8px;overflow:hidden;max-width:260px}
.pbar span{display:block;height:100%;background:var(--ok)}
.banner{background:var(--accent-soft);color:#7a2615;border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 10px}
.round-h{font-size:12.5px;color:var(--muted);margin:16px 0 6px;display:flex;align-items:center;gap:8px;font-weight:700}
.round-h::after{content:"";flex:1;height:1px;background:var(--line)}
.round-h.wait{font-weight:400;font-style:italic}
.mlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:8px}
.m{display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px}
.mh{display:flex;align-items:center;gap:10px;min-height:28px}
.mh .tail{margin-left:auto;display:flex;align-items:center}
.m .no{font-weight:800;font-size:16px}
.stt{font-size:12px;color:var(--muted)}
.stt.rec{color:var(--accent);font-weight:700}
.stt.ff{color:var(--warn);font-weight:700}
.cp{font-size:12px;background:var(--ai-soft);color:var(--ai);border-radius:6px;padding:2px 7px;white-space:nowrap;font-weight:700}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.vs .x{align-self:center}
.x{font-size:12px;color:var(--muted);font-weight:400}
.fft{font-style:normal;font-size:11.5px;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:1px 6px;font-weight:700;white-space:nowrap}
.nb{border:1.5px solid var(--line2);border-bottom-width:3px;background:#fff;border-radius:12px;padding:6px 10px;font-weight:800;font-size:18px;cursor:pointer;min-height:52px;width:100%;display:flex;align-items:center;justify-content:center;gap:4px 6px;flex-wrap:wrap;text-align:center;overflow-wrap:anywhere;color:var(--ink);touch-action:manipulation}
.nb small{font-size:12.5px;font-weight:400;color:var(--muted)}
.nb:hover{border-color:var(--ink)}
.nb:active{transform:translateY(1px);border-bottom-width:2px}
.nb.win{background:var(--accent-soft);border-color:var(--accent);color:#6e2213}
.nb.win small{color:#8a3a26;font-weight:700}
.nb.lose{color:#a3a6ad;border-color:var(--line);border-bottom-width:1.5px;background:transparent;font-weight:700}
.nb.static{cursor:default}
.nb.static:hover{border-color:var(--line2)}
.nb.win.static:hover{border-color:var(--accent)}
.nb.lose.static:hover{border-color:var(--line)}
.maru{width:16px;height:16px;border:2.8px solid var(--accent);border-radius:50%;display:inline-block;flex:none}
.chk{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line2);background:#fff;cursor:pointer;display:grid;place-items:center;color:transparent;padding:0;flex:none}
.chk:hover{color:var(--line2)}
.chk[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.chk:disabled{opacity:.3;cursor:default}
.m.done{background:#f8f6f0}
.m.done .no{color:#8b8f97}
.m.checked{border-color:#b9d8c1;background:#f2f8f3}
.m[data-act=pick]{cursor:pointer}
.mlist.one{grid-template-columns:1fr;max-width:640px}
.listhelp{margin:0 0 4px}
.csum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.csum div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.csum span{display:block;font-size:12px;color:var(--muted)}
.csum b{font-size:18px}
.tblwrap{overflow-x:auto;margin-bottom:8px}
table.rk{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:15px}
table.rk th,table.rk td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left}
table.rk tr:last-child td{border-bottom:0}
table.rk th{font-size:12.5px;color:var(--muted);background:#f7f4ec;white-space:nowrap}
table.rk .n{text-align:right;width:3.5em}
table.rk .rkno{font-weight:800;width:4em;white-space:nowrap}
table.rk .rkno small{font-size:11px;color:var(--muted);font-weight:400;margin-left:2px}
table.rk tr.top1 .rkno{color:var(--accent)}
table.rk tr.abs td{color:#8b8f97}
.muted{color:var(--muted);font-weight:400}
.imp{border:1px solid var(--line2);border-radius:12px;padding:12px;margin-top:10px;background:#fff}
.imp-h{margin:0;font-weight:700;font-size:14px;overflow-wrap:anywhere}
.imp .prev{font-size:14px;margin:10px 0 0}
label.cb{display:flex;align-items:center;gap:8px;min-height:44px;font-size:15px}
label.cb input{width:20px;height:20px;accent-color:var(--accent)}
.m.sel{outline:3px solid var(--accent);outline-offset:-1px}
.pickhint{font-size:12px;color:var(--accent);font-weight:700;min-width:3em;text-align:right}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{border:1px solid var(--line2);background:#fff;border-radius:12px;padding:8px 14px;cursor:pointer;font-size:15px;font-weight:700;white-space:nowrap;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.chip small{font-weight:400;font-size:11.5px;color:var(--muted)}
.chip[aria-selected=true]{background:var(--ai);border-color:var(--ai);color:#fff}
.chip[aria-selected=true] small{color:#d6e3f1}
.search{margin-bottom:10px}
.plist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:6px}
.pr{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px}
.pr .pn{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.pr .pn b{overflow-wrap:anywhere}
.pr .pn span{font-size:12px;color:var(--muted)}
.pr.abs .pn b{text-decoration:line-through;color:#8b8f97}
.st{font-size:11.5px;border-radius:6px;padding:2px 6px;background:#efece4;color:var(--muted);white-space:nowrap}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.redo{background:var(--accent-soft);color:var(--accent);font-weight:700}
.dots{margin:0;padding-left:1.2em;font-size:14.5px}
.dots li{margin:4px 0}
.url{word-break:break-all;color:var(--ink)}
dialog#dlg{border:0;border-radius:18px;padding:0;width:min(440px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog#dlg::backdrop{background:rgba(20,22,28,.55)}
.dlg-in{padding:16px}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dlg-t{margin:0;font-size:22px;font-weight:800}
.dlg-t span{font-size:14px;font-weight:400;color:var(--muted);margin-left:2px}
.qrbox{background:#fff;border-radius:12px;padding:8px;margin:12px auto 0;max-width:340px}
.qrbox svg{display:block;width:100%;height:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;max-width:min(560px,calc(100vw - 32px));opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}
.empty p{margin:0}
/* 選手モード */
.pv{max-width:560px;margin:0 auto;padding:22px 16px 48px}
.pv-title{margin:0;font-size:13px;color:var(--muted);letter-spacing:.04em}
.pv-name{margin:2px 0 0;font-size:28px;line-height:1.3}
.pv-name span{font-size:16px;font-weight:400;color:var(--muted);margin-left:4px}
.pv-meta{margin:4px 0 14px;font-size:13.5px;color:var(--muted)}
ol.pl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pe{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:54px}
.pmode .pe{cursor:pointer}
.pe-no{font-weight:800;font-size:17px;min-width:3.6em}
.pe-opp{font-weight:700;overflow-wrap:anywhere}
.pe-ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2)}
.pe.done{background:#f1efe8}
.pe.done .pe-no,.pe.done .pe-opp{color:#8b8f97}
.pe.done .pe-ck{background:var(--ok);border-color:var(--ok)}
.pe.ff .pe-opp{color:#8b8f97}
.pv-note{font-size:13px;color:var(--muted);margin:16px 0 0}
.pv-safe{font-size:12px;color:var(--ai);background:var(--ai-soft);border-radius:10px;padding:8px 10px;margin:12px 0 0}
.dlg-in ol.pl .pe{min-height:44px;padding:6px 10px}
.dlg-in ol.pl .pe-ck{display:none}
.ask{background:#fff;border:2px solid var(--accent);border-radius:14px;padding:12px 14px;margin:10px 0 14px}
.ask p{margin:0 0 6px;font-size:15px}
.ask .btns{margin-top:10px}
.ask .pno{font-size:.8em}
.kchips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.kchip{border:1.5px solid var(--line2);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;color:var(--ink)}
.kchip small{font-weight:400;font-size:11.5px;color:var(--muted);margin-left:2px}
.kchip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.kchip[aria-pressed=true] small{color:#c8ccd4}
.kchip .pno{font-size:.78em}
.kdot{width:10px;height:10px;border-radius:50%;background:var(--kc);flex:none;margin-right:2px}
.pe.multi{border-left:6px solid var(--kc)}
.kt{display:inline-flex;align-items:center;font-weight:800;color:var(--kc);margin-right:2px}
.kt .pno{background:var(--kc)}
.pe-opp{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px}
.vline{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.opp{display:inline-flex;align-items:center;white-space:nowrap}
.pe.multi .pe-opp{flex-direction:column;align-items:flex-start;gap:1px}
.pe.multi .kt{font-size:14px}
.sib{font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 6px;font-weight:700;white-space:nowrap}
.saved{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:16px}
.saved h2{font-size:15px;margin:0 0 6px}
.saved ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.saved li{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.saved li small{color:var(--muted);font-size:12px}
.saved li .btn{margin-left:auto}
.saved .pno{font-size:.8em}
#print{display:none}
.setup-grid{display:grid;gap:0 16px}
.cards2{display:grid;gap:0 16px}
.rule ol{margin:0}
.pv-name span.pno{font-size:.62em;color:#fff;font-weight:800;margin:0 .35em 0 0;vertical-align:.18em;display:inline-flex}
.pe-opp .pno{font-size:.78em;margin-left:.3em}
.pr .pno{font-size:.9em}
.courts-wide{display:grid;grid-template-columns:repeat(var(--cols),minmax(290px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.ccol{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px 10px;min-width:0;display:flex;flex-direction:column}
.ccol-h{margin:0 2px 8px;font-size:18px}
.ccol .csum{gap:6px;margin-bottom:10px}
.ccol .csum div{padding:6px 8px}
.ccol .csum span{font-size:11px}
.ccol .csum b{font-size:14px}
.ccol .mlist.one{max-width:none;max-height:calc(100vh - 290px);min-height:240px;overflow-y:auto;position:relative;padding:2px 4px 2px 2px}
.ccol .m{padding:8px 10px 10px}
.ccol .nb{font-size:15px;min-height:46px;padding:4px 6px}
/* タブレット以上 */
@media (min-width:720px){
  .t-rank .tblwrap,.t-rank .rule{max-width:900px}
}
@media (min-width:900px){
  .cards2{grid-template-columns:1fr 1fr;align-items:start}
}
/* パソコン */
@media (min-width:1100px){
  header.top,nav.tabs .in,main{max-width:1360px}
  main{padding-left:24px;padding-right:24px}
  header.top,nav.tabs .in{padding-left:24px;padding-right:24px}
  .setup-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .setup-grid textarea{min-height:360px}
  .mlist{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
  .plist{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
}
/* スマホ */
@media (max-width:719px){
  header.top{padding:12px 16px 6px}
  .brand{font-size:18px}
  .lock{font-size:11px;padding:3px 8px}
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:20;border-top:1px solid var(--line);border-bottom:0;background:rgba(245,242,234,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs .in{display:grid;grid-template-columns:repeat(6,1fr);gap:0;padding:4px 2px 2px;overflow:visible}
  .tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0 3px;border-radius:12px;font-size:10.5px;letter-spacing:-.01em}
  .tab .tl{display:none}
  .tab .tsh{display:block;line-height:1.3}
  .tab .ico{display:block;width:44px;height:28px;padding:3px 11px;border-radius:999px}
  .tab[aria-selected=true]{background:transparent;color:var(--ink)}
  .tab[aria-selected=true] .ico{background:var(--ink);color:#fff}
  main{padding:12px 12px calc(96px + env(safe-area-inset-bottom))}
  #toast{bottom:calc(82px + env(safe-area-inset-bottom))}
  .sum{grid-template-columns:repeat(2,1fr)}
  .mlist,.plist{grid-template-columns:1fr}
  .csum b{font-size:15px}
  .toolbar{gap:8px}
  table.rk th,table.rk td{padding:8px 8px}
  table.rk .n{width:2.6em}
  table.rk .rkno{width:3em}
  .card{padding:14px}
  dialog#dlg{max-height:calc(100vh - 40px)}
}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;font-size:10pt}
  .pq{display:grid;grid-template-columns:repeat(3,1fr)}
  .qc{border:1px dashed #999;padding:3mm 3mm 2mm;text-align:center;break-inside:avoid;height:69mm;display:flex;flex-direction:column;align-items:center}
  .qc svg{width:46mm;height:46mm}
  .qc-t{margin:0;font-size:8pt;color:#444}
  .qc-n{margin:0 0 1mm;font-size:14pt;font-weight:800}
  .qc-no{display:inline-block;border:1.5px solid #000;color:#000;border-radius:3px;padding:0 1.4mm;margin-right:1.6mm;font-size:11pt;line-height:1.3;vertical-align:1pt}
  .qc-m{margin:1mm 0 0;font-size:8pt;color:#444}
  .pt-h{font-size:13pt;margin:0 0 4mm}
  table.pt{width:100%;border-collapse:collapse}
  table.pt th,table.pt td{border:1px solid #888;padding:1.2mm 2mm;text-align:left}
  table.pt th{background:#eee}
  table.pt tr{break-inside:avoid}
  table.pt tr.ff td{color:#777}
  table.pt.sheet{font-size:10pt}
  table.pt.sheet th{text-align:center;padding:1mm;white-space:nowrap}
  table.pt.sheet thead th:first-child{width:14mm;white-space:normal}
  table.pt.sheet td{height:9mm;padding:1mm 1.5mm}
  table.pt.sheet td.c{text-align:center;width:10mm}
  table.pt.sheet td.nm{font-weight:700;font-size:11.5pt}
  table.pt.sheet td.kn{font-size:8pt;color:#444}
  table.pt.sheet td.vs{text-align:center;color:#666;width:7mm}
  table.pt.sheet td.mk{width:24mm;text-align:center;font-weight:700;letter-spacing:.05em}
  table.pt thead{display:table-header-group}
  .pt-note{font-size:9pt;color:#444;margin:2mm 0 0}
  .pc{break-after:page}
  .pc:last-child{break-after:auto}
}

  /* ----- 順位 ----- */
  function standings() {
    var st = S.players.map(function (p) { return { id: p.id, name: p.name, absent: p.absent, w: 0, l: 0, ffw: 0, rem: 0 }; });
    var beat = {};
    S.matches.forEach(function (m) {
      var w = winnerId(m);
      if (w == null) {
        if (!(absent(m.a) && absent(m.b))) { st[m.a].rem++; st[m.b].rem++; }
        return;
      }
      var l = w === m.a ? m.b : m.a;
      st[w].w++;
      if (!m.win) st[w].ffw++; else st[l].l++;
      beat[w + "-" + l] = true;
    });
    var active = st.filter(function (s) { return !s.absent; });
    function resolve(group) {
      if (group.length < 2) return [group];
      var mini = {};
      group.forEach(function (g) {
        mini[g.id] = 0;
        group.forEach(function (h) { if (h !== g && beat[g.id + "-" + h.id]) mini[g.id]++; });
      });
      var vals = {};
      group.forEach(function (g) { vals[mini[g.id]] = true; });
      if (Object.keys(vals).length === 1) return [group];
      var sorted = group.slice().sort(function (a, b) { return mini[b.id] - mini[a.id] || a.id - b.id; });
      var out = [], cur = [];
      sorted.forEach(function (g, i) {
        if (i && mini[g.id] !== mini[sorted[i - 1].id]) { out.push(cur); cur = []; }
        cur.push(g);
      });
      out.push(cur);
      return out.reduce(function (acc, sub) { return acc.concat(resolve(sub)); }, []);
    }
    var byW = {};
    active.forEach(function (s) { (byW[s.w] = byW[s.w] || []).push(s); });
    Object.keys(byW).forEach(function (w) {
      var g = byW[w];
      if (g.length < 2) return;
      g.forEach(function (s) {
        var c = 0;
        g.forEach(function (h) { if (h !== s && beat[s.id + "-" + h.id]) c++; });
        s.tieN = g.length; s.tieW = c;
      });
    });
    var blocks = [];
    Object.keys(byW).map(Number).sort(function (a, b) { return b - a; }).forEach(function (w) {
      blocks = blocks.concat(resolve(byW[w].sort(function (a, b) { return a.id - b.id; })));
    });
    var list = [], pos = 1;
    blocks.forEach(function (bk) {
      bk.forEach(function (s) { s.rank = pos; s.tie = bk.length > 1; list.push(s); });
      pos += bk.length;
    });
    st.filter(function (s) { return s.absent; }).forEach(function (s) { s.rank = null; list.push(s); });
    return list;
  }

  function startImport(file) {
    XL.readTable(file).then(function (rows) {
      rows = rows.filter(function (r) { return r.some(function (v) { return v; }); });
      if (!rows.length) throw new Error("empty");
      var head = /名前|氏名|選手|なまえ|ニックネーム|name/i, kanaHead = /ふりがな|フリガナ|よみ|ヨミ|読み|かな|カナ|kana|yomi|furigana/i;
      var col = -1, kcol = -1, header = false;
      rows[0].forEach(function (v, i) {
        if (kanaHead.test(v)) { if (kcol < 0) { kcol = i; header = true; } }
        else if (col < 0 && head.test(v)) { col = i; header = true; }
      });
      if (col < 0) {
        var best = -1;
        rows[0].forEach(function (_, i) {
          if (i === kcol) return;
          var n = rows.filter(function (r) { return r[i] && !/^[\d.\-\/:]+$/.test(r[i]); }).length;
          if (n > best) { best = n; col = i; }
        });
      }
      U.imp = { file: file.name, rows: rows, col: col, kcol: kcol, header: header };
      document.getElementById("impBox").innerHTML = impHTML();
    }).catch(function (e) {
      var msg = e && e.message === "xls" ? "古い形式（.xls）は読み込めません。.xlsx か .csv で保存し直してから選んでください。" :
        e && e.message === "old-browser" ? "このブラウザでは .xlsx を読み込めません。.csv で保存し直すか、名前の列をコピーして貼り付けてください。" :
          "このファイルは読み込めませんでした。.xlsx か .csv を選んでください。";

      document.getElementById("impBox").innerHTML = impHTML();
    });
  }
  function rosterInfo() {

        '<p class="num help">この設定だと最短でも' + mr.bound + "巡・" + fmtMin(mr.bound * S.minutes) + "ほど" +

  function renderOverrides() {

  function resultCard() {

  function generate() {
    var pr = parseRoster();
    if (pr.names.length < 2) { toast("名簿を2人以上入れてください"); return; }
    if (pr.dups.length) { toast("同じ名前があります。区別がつくように変えてください"); return; }
    var courts = Math.max(1, Math.min(16, S.courts | 0));
    if (S.players.length) {
      var recorded = S.matches.filter(function (m) { return m.win; }).length;
      var msg = "組み合わせを作り直すと、試合番号がすべて変わります。" +
        (recorded ? "\n記録した勝敗（" + recorded + "試合分）も消えます。" : "") +
        (Object.keys(S.issued).length ? "\n配ったQRコードや印刷した記録用紙も使えなくなります。" : "") + "\n作り直しますか？";
      if (!confirm(msg)) return;
    }
    var names = pr.names, rest = names.map(restOf);
    U.gen = 0;
    renderMain();
    Sched.build({ n: names.length, courts: courts, rest: rest, strict: S.strict, tries: names.length > 40 ? 100 : 240 },
      function (f) {
        U.gen = f;
        var b = document.querySelector("#genProg .bar");
        if (b) b.style.width = Math.round(f * 100) + "%";
      },
      function (best) {
        var matches = [], no = 1, empties = 0;
        best.rounds.forEach(function (ms, ri) {
          if (!ms.length) empties++;
          ms.forEach(function (m, ci) {
            matches.push({ no: no++, round: ri + 1, court: ci + 1, a: m[0], b: m[1], win: null, chk: false });
          });
        });
        S.players = names.map(function (nm, i) { return { id: i, name: nm, kana: pr.kanas[i] || "", rest: rest[i], absent: false }; });
        S.matches = matches;
        S.issued = {}; S.dirty = {};
        S.courts = courts;
        S.genAt = stampNow();
        S.ev = Date.now().toString(36);
        var viol = [];
        best.eval.minGap.forEach(function (g, i) { if (g < rest[i]) viol.push({ name: names[i], gap: g }); });
        S.result = { rounds: best.rounds.length, empties: empties, violations: viol, usable: Sched.minRounds(names.length, courts, rest).usableCourts };
        S.court = 1;
        U.gen = null;
        save();
        renderMain();
        toast("組み合わせができました（全" + matches.length + "試合）");
        var rc = document.querySelector(".result");
        if (rc) rc.scrollIntoView({ behavior: "smooth", block: "start" });
      });
  }

      .map(function (m) { var o = m.a === id ? m.b : m.a; return { no: m.no, court: CL(m.court), oppNum: pnum(o), opp: pname(o), ff: isFF(m) }; });

    return { p: p, url: url, svg: QR.toSvg(q, { label: p.name + "さんの試合一覧のQRコード" }), version: q.version };

  function importData(file) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var o = JSON.parse(fr.result);
        if (!o || o.v !== 1 || !Array.isArray(o.matches)) throw new Error("x");
        if (!confirm("今のデータを、読み込んだファイルの内容に置きかえます。よろしいですか？")) return;
        S = migrate(Object.assign(defaults(), o));
        U = freshU();
        save(); render(); toast("読み込みました");
      } catch (e) { toast("このファイルは読み込めませんでした"); }
    };
    fr.readAsText(file);
  }

  /* ----- 入れ替え ----- */
  function gapsOf(id) {
    var rs = S.matches.filter(function (m) { return m.a === id || m.b === id; }).map(function (m) { return m.round; }).sort(function (a, b) { return a - b; });
    var g = Infinity;
    for (var i = 1; i < rs.length; i++) g = Math.min(g, rs[i] - rs[i - 1] - 1);
    return g;
  }
  function pick(no) {
    var m = byNo(no);
    if (!m || settled(m)) { toast("記録済み・不戦の試合は入れ替えられません"); return; }
    if (U.sel == null) { U.sel = no; renderMain(); return; }
    if (U.sel === no) { U.sel = null; renderMain(); return; }
    var m1 = byNo(U.sel), m2 = m;
    var a = m1.a, b = m1.b;
    m1.a = m2.a; m1.b = m2.b; m2.a = a; m2.b = b;
    var ids = [m1.a, m1.b, m2.a, m2.b], issuedHit = [];
    ids.forEach(function (id) { if (S.issued[id]) { S.dirty[id] = true; issuedHit.push(pname(id)); } });
    var short = ids.filter(function (id, i) { return ids.indexOf(id) === i && gapsOf(id) < S.players[id].rest; })
      .map(function (id) { var g = gapsOf(id); return pname(id) + (g < 0 ? "（同じ巡に2試合）" : "（休み" + g + "巡）"); });
    U.sel = null;
    save(); renderMain();
    var msg = "No." + m1.no + "とNo." + m2.no + "を入れ替えました。印刷済みの記録用紙があれば、この2試合を書き直してください。";
    if (short.length) msg += " 休みが短くなる選手：" + short.join("、") + "。";
    if (issuedHit.length) msg += " QRの再発行が必要です。";
    toast(msg);
  }

  /* ----- イベント ----- */
  var ovTimer = null;
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");
    switch (act) {
      case "tab":
        S.tab = t.getAttribute("data-tab"); U.swap = false; U.sel = null; save(); render(); window.scrollTo(0, 0); break;
      case "generate": generate(); break;
      case "sample":
        if (S.roster.trim() && !confirm("今の名簿をサンプル（選手01〜選手30）に置きかえますか？")) return;
        var arr = []; for (var i = 1; i <= 30; i++) arr.push("選手" + pad2(i));
        S.roster = arr.join("\n"); save(); renderMain(); break;
      case "win": setWin(+t.getAttribute("data-no"), t.getAttribute("data-side"), true); break;
      case "chk":
        var cm = byNo(+t.getAttribute("data-no"));
        if (cm && settled(cm)) { cm.chk = !cm.chk; save(); refreshRow(cm); }
        break;
      case "hideChecked": S.hideChecked = !S.hideChecked; save(); renderMain(); break;
      case "onlyOpen": S.onlyOpen = !S.onlyOpen; save(); renderMain(); break;
      case "swap": U.swap = !U.swap; U.sel = null; renderMain(); break;
      case "pick": pick(+t.getAttribute("data-no")); break;
      case "court": S.court = +t.getAttribute("data-c"); save(); renderMain(); break;
      case "absent":
        var p = S.players[+t.getAttribute("data-id")];
        p.absent = !p.absent; save();
        document.getElementById("plist").innerHTML = playerRows();
        toast(pnum(p.id) + "番 " + p.name + (p.absent ? "さんを欠席にしました。まだ記録していない試合は不戦扱いで、番号はそのままです。" : "さんの欠席を取り消しました。"));
        break;
      case "qr": openQR(+t.getAttribute("data-id")); break;
      case "close": closeDlg(); break;
      case "printQR": printQR(t.getAttribute("data-which"), +t.getAttribute("data-id")); break;
      case "printAll": printAll(); break;
      case "printCourts": printCourts(); break;
      case "xlsxSheets": xlsxSheets(); break;
      case "xlsxResults": xlsxResults(); break;
      case "impApply":
        var names = impNames();
        if (!names.length) return;
        if (S.roster.trim() && !confirm("今の名簿を、読み込んだ" + names.length + "人に置きかえます。よろしいですか？")) return;
        S.roster = names.map(function (e) { return e.kana ? e.name + "," + e.kana : e.name; }).join("\n"); U.imp = null; save(); renderMain();
        toast(names.length + "人を名簿に入れました。確認してから「組み合わせを作る」を押してください。");
        break;
      case "impCancel": U.imp = null; document.getElementById("impBox").innerHTML = ""; break;
      case "export": exportData(); break;
      case "wipe":
        if (!confirm("この端末に保存された名簿・組み合わせ・勝敗をすべて消去します。元に戻せません。よろしいですか？")) return;
        try { localStorage.removeItem(KEY); } catch (e) { }
        S = defaults(); U = freshU();
        render(); toast("すべて消去しました"); break;
    }
  });
  document.addEventListener("input", function (ev) {
    var el = ev.target, f = el.getAttribute && el.getAttribute("data-f");
    if (!f) return;
    switch (f) {
      case "title":
        S.title = el.value; save();
        var bs = document.getElementById("brandSub"); if (bs) bs.textContent = S.title || "スポーツチャンバラ";
        break;
      case "courts":
        var c = parseInt(el.value, 10); if (c >= 1 && c <= 16) { S.courts = c; save(); rosterInfo(); } break;
      case "minutes":
        var mn = parseFloat(el.value); if (mn > 0 && mn <= 60) { S.minutes = mn; save(); rosterInfo(); } break;
      case "roster":
        S.roster = el.value; save();
        clearTimeout(ovTimer);
        ovTimer = setTimeout(rosterInfo, 350);
        break;
      case "baseUrl": S.baseUrl = el.value.trim(); save(); break;
      case "q": U.q = el.value; document.getElementById("plist").innerHTML = playerRows(); break;
    }
  });
  document.addEventListener("change", function (ev) {
    var el = ev.target, f = el.getAttribute && el.getAttribute("data-f");
    if (!f) return;
    switch (f) {
      case "rest": S.rest = parseInt(el.value, 10); save(); rosterInfo(); break;
      case "strict": S.strict = el.value === "1"; save(); break;
      case "ov":
        var nm = el.getAttribute("data-name");
        if (el.value === "") delete S.overrides[nm]; else S.overrides[nm] = parseInt(el.value, 10);
        save(); rosterInfo();
        break;
      case "import": if (el.files && el.files[0]) importData(el.files[0]); el.value = ""; break;
      case "rosterFile": if (el.files && el.files[0]) startImport(el.files[0]); el.value = ""; break;
      case "impCol": if (U.imp) { U.imp.col = parseInt(el.value, 10); document.getElementById("impBox").innerHTML = impHTML(); } break;
      case "impHead": if (U.imp) { U.imp.header = el.checked; document.getElementById("impBox").innerHTML = impHTML(); } break;
      case "impKana": if (U.imp) { U.imp.kcol = parseInt(el.value, 10); document.getElementById("impBox").innerHTML = impHTML(); } break;
    }
  });
  if (window.matchMedia) {
    var mq = window.matchMedia("(min-width: 1100px)");
    var onMq = function () { if (S.tab === "court" && S.matches.length && U.wide !== isWide()) renderMain(); };
    if (mq.addEventListener) mq.addEventListener("change", onMq); else if (mq.addListener) mq.addListener(onMq);
  }
  document.addEventListener("toggle", function (ev) {
    if (ev.target && ev.target.id === "ovBox") U.ovOpen = ev.target.open;
  }, true);
  var dlg = document.getElementById("dlg");
  dlg.addEventListener("click", function (ev) { if (ev.target === dlg) closeDlg(); });
  dlg.addEventListener("cancel", function (ev) { ev.preventDefault(); closeDlg(); });

  render();
})();

</script>
</body>
</html>
